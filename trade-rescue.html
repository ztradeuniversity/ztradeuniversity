<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>ZTU Rescue — Trade Management &amp; Analysis</title>
<meta name="description" content="Stuck in a trade? Speak or type. ZTU Rescue collects your trade context, pulls verified current market data, and gives a structured, evidence-based read on where the position stands." />
<link rel="icon" type="image/png" href="assets/ztu-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff; --bg2:#f7f7f8; --side:#f9f9fa;
    --line:#e6e6e8; --line2:#d9d9dd;
    --text:#1f2024; --muted:#6b6d76; --muted2:#8e919b;
    --accent:#c8891f; --accent2:#a9711a; --accent-soft:#fdf6e8;
    --ok:#177245; --ok-bg:#e9f5ef; --warn:#8a6100; --warn-bg:#fdf3e0;
    --user:#f2f3f5;
    --r:12px;
    --side-w:264px;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;height:100dvh}

  /* ── sidebar ─────────────────────────────────────────── */
  aside{width:var(--side-w);flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:transform .22s ease}
  .side-top{padding:12px;border-bottom:1px solid var(--line)}
  .newbtn{width:100%;display:flex;align-items:center;gap:9px;background:var(--bg);
    border:1px solid var(--line2);border-radius:var(--r);padding:10px 13px;font-size:14px;
    font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;transition:.14s}
  .newbtn:hover{border-color:var(--accent);color:var(--accent2)}
  .newbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .side-scroll{flex:1;overflow-y:auto;padding:10px 8px}
  .side-lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);
    padding:8px 8px 6px;font-weight:600}
  .hitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
    border:0;border-radius:9px;padding:9px 10px;font-size:13.5px;color:var(--muted);cursor:pointer;
    font-family:inherit;line-height:1.4}
  .hitem:hover{background:#eeeef0;color:var(--text)}
  .hitem.on{background:#eceef1;color:var(--text);font-weight:600}
  .hitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .hitem .del{opacity:0;border:0;background:transparent;color:var(--muted2);cursor:pointer;
    font-size:14px;padding:0 3px;border-radius:5px;line-height:1}
  .hitem:hover .del{opacity:1}
  .hitem .del:hover{color:#c0392b}
  .side-foot{padding:11px 12px;border-top:1px solid var(--line);font-size:12px}
  .side-foot a{color:var(--muted);text-decoration:none}
  .side-foot a:hover{color:var(--accent2)}
  .sideScrim{display:none}

  /* ── main ────────────────────────────────────────────── */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header.bar{display:flex;align-items:center;gap:11px;padding:11px 20px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
  .burger{display:none;background:transparent;border:1px solid var(--line2);border-radius:9px;
    width:34px;height:34px;cursor:pointer;color:var(--muted);align-items:center;justify-content:center}
  .title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .title b{color:var(--accent2)}
  .bar .sp{margin-left:auto}

  /* compact access badge */
  .acc{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 10px;
    border-radius:20px;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);white-space:nowrap}
  .acc.ok{background:var(--ok-bg);border-color:#bfe0ce;color:var(--ok)}
  .acc.no{background:var(--warn-bg);border-color:#f0dcb4;color:var(--warn)}
  .acc b{font-weight:700}
  .verifyBtn{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.14s}
  .verifyBtn:hover{background:var(--accent2);border-color:var(--accent2)}
  .verifyBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topLink{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
  .topLink:hover{color:var(--accent2)}

  /* ── conversation ────────────────────────────────────── */
  .scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .thread{max-width:760px;margin:0 auto;padding:28px 22px 20px;display:flex;flex-direction:column;gap:26px}
  .turn{display:flex;flex-direction:column;gap:7px}
  .turn.me{align-items:flex-end}
  .me .txt{background:var(--user);border-radius:18px 18px 5px 18px;padding:11px 16px;max-width:78%;
    white-space:pre-wrap;word-wrap:break-word}
  .me .mic-tag{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}
  .ai .txt{max-width:100%}
  .ai .txt h3{font-size:14.5px;font-weight:700;margin:22px 0 7px;color:var(--text);letter-spacing:-.005em}
  .ai .txt h3:first-child{margin-top:0}
  .ai .txt p{margin-bottom:11px}
  .ai .txt p:last-child{margin-bottom:0}
  .ai .txt ul{margin:6px 0 13px;padding-left:20px}
  .ai .txt li{margin-bottom:5px}
  .ai .txt li::marker{color:var(--accent)}
  .ai .txt strong{font-weight:650}
  .ai .txt em{color:var(--muted)}
  .ai .txt a{color:var(--accent2)}
  .ai .txt code{background:var(--bg2);padding:1.5px 6px;border-radius:5px;
    font-family:'JetBrains Mono',monospace;font-size:.87em}

  .rowacts{display:flex;gap:5px;align-items:center;margin-top:3px}
  .iact{background:transparent;border:0;color:var(--muted2);border-radius:7px;padding:5px 8px;
    font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .iact:hover{background:var(--bg2);color:var(--text)}
  .iact:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .iact[aria-pressed="true"]{color:var(--accent2);background:var(--accent-soft)}

  /* provenance — compressed into a detail disclosure */
  details.prov{margin-top:10px;font-size:12px}
  details.prov summary{cursor:pointer;color:var(--muted2);list-style:none;display:inline-flex;
    align-items:center;gap:6px;padding:3px 0}
  details.prov summary::-webkit-details-marker{display:none}
  details.prov summary::before{content:'▸';font-size:10px;transition:.15s}
  details.prov[open] summary::before{transform:rotate(90deg)}
  details.prov .body{margin-top:7px;padding:10px 12px;background:var(--bg2);border-radius:9px;
    border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:10.5px;
    line-height:1.65;color:var(--muted)}
  details.prov .miss{color:var(--warn)}

  /* trade case strip */
  .case{max-width:760px;margin:0 auto;padding:0 22px;display:none}
  .case.on{display:block}
  .caseIn{display:flex;flex-wrap:wrap;gap:6px;padding:11px 0 3px;border-top:1px solid var(--line)}
  .chip{display:inline-flex;gap:6px;align-items:baseline;background:var(--bg2);
    border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
  .chip b{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:600}
  .chip s{text-decoration:none;font-family:'JetBrains Mono',monospace;color:var(--text)}
  .chip.alert{background:#fdf0f0;border-color:#f2d5d5}
  .chip.alert s{color:#b03a3a}

  /* state line */
  .state{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted2);animation:bl 1.25s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,62%,100%{opacity:.3}31%{opacity:1}}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:#d14343;animation:pl 1.1s infinite}
  @keyframes pl{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

  /* limit / gate card */
  .gate{border:1px solid #f0dcb4;background:var(--warn-bg);border-radius:var(--r);padding:16px 18px}
  .gate h4{font-size:14.5px;font-weight:700;margin-bottom:6px;color:var(--warn)}
  .gate p{font-size:13.5px;color:#6d5518;margin-bottom:10px}
  .gate ul{margin:0 0 12px;padding-left:19px;font-size:13px;color:#6d5518}
  .gate li{margin-bottom:3px}
  .gate .gb{display:flex;gap:8px;flex-wrap:wrap}
  .gate .gb a,.gate .gb button{font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px;
    text-decoration:none;cursor:pointer;font-family:inherit;border:1px solid var(--accent)}
  .gate .gb .primary{background:var(--accent);color:#fff}
  .gate .gb .ghost{background:transparent;color:var(--accent2)}

  /* transcript review */
  .review{max-width:760px;margin:0 auto 12px;padding:0 22px;display:none}
  .review.on{display:block}
  .reviewIn{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:13px 15px}
  .reviewIn h4{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent2);
    font-weight:700;margin-bottom:4px}
  .reviewIn p{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .reviewIn textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;
    padding:10px 12px;font-family:inherit;font-size:14.5px;color:var(--text);resize:vertical;min-height:66px}
  .reviewIn textarea:focus{outline:none;border-color:var(--accent)}
  .rb{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .rb button{font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);
    background:var(--bg);cursor:pointer;font-family:inherit;color:var(--text)}
  .rb button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* ── composer ────────────────────────────────────────── */
  .composer{border-top:1px solid var(--line);background:var(--bg);padding:14px 22px calc(12px + env(safe-area-inset-bottom))}
  .cwrap{max-width:760px;margin:0 auto}
  .cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);border-radius:24px;
    padding:7px 7px 7px 8px;background:var(--bg);transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,137,31,.09)}
  .icon{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:0;background:transparent;
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .icon:hover:not([disabled]){background:var(--bg2);color:var(--text)}
  .icon:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .icon[disabled]{opacity:.35;cursor:not-allowed}
  .icon svg{width:19px;height:19px}
  .icon.rec{background:#fdeaea;color:#c0392b}
  .icon.rec::after{content:'';position:absolute;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(192,57,43,.4);animation:ring 1.4s infinite}
  @keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
  textarea#in{flex:1;border:0;background:transparent;resize:none;font-family:inherit;font-size:15.5px;
    color:var(--text);padding:9px 2px;max-height:180px;min-height:38px;line-height:1.5}
  textarea#in:focus{outline:none}
  textarea#in::placeholder{color:var(--muted2)}
  #send{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:0;background:var(--text);
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  #send:hover:not([disabled]){background:#000}
  #send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #send[disabled]{opacity:.28;cursor:not-allowed}
  #send svg{width:17px;height:17px}
  .cfoot{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--muted2);flex-wrap:wrap}
  .cfoot select{border:1px solid var(--line2);background:var(--bg);border-radius:7px;padding:3px 7px;
    font-family:inherit;font-size:11px;color:var(--muted);cursor:pointer}
  .cfoot select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cfoot .right{margin-left:auto;text-align:right}
  .vs{color:var(--accent2);font-weight:600;display:none;align-items:center;gap:6px}
  .vs.on{display:inline-flex}
  .verr{color:#b03a3a;display:none;width:100%}
  .verr.on{display:block}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @media(max-width:860px){
    aside{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.16)}
    aside.open{transform:none}
    .sideScrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:55;
      opacity:0;pointer-events:none;transition:.2s}
    .sideScrim.open{opacity:1;pointer-events:auto}
    .burger{display:flex}
    .thread{padding:20px 16px 16px}
    .case{padding:0 16px}
    .review{padding:0 16px}
    .composer{padding:11px 14px calc(10px + env(safe-area-inset-bottom))}
    .me .txt{max-width:88%}
    .topLink{display:none}
  }
  /* Narrow phones: the header must never push the Verify action off-screen. */
  @media(max-width:560px){
    header.bar{padding:10px 12px;gap:8px}
    .title{font-size:14px}
    .acc{font-size:10.5px;padding:3px 8px}
    .acc .detail{display:none}
    .verifyBtn{font-size:10.5px;padding:4px 9px}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="sideScrim" id="scrim"></div>

  <aside id="side">
    <div class="side-top">
      <button class="newbtn" id="newBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New analysis
      </button>
    </div>
    <div class="side-scroll">
      <div class="side-lbl">Your analyses</div>
      <div id="histList"></div>
    </div>
    <div class="side-foot">
      <a href="index.html">← Z Trade University</a>
    </div>
  </aside>

  <main>
    <header class="bar">
      <button class="burger" id="burger" type="button" aria-label="Open history"
        aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="title">ZTU <b>Rescue</b></div>
      <span class="acc" id="accBadge" aria-live="polite">…</span>
      <button class="verifyBtn" id="verifyBtn" type="button" hidden>Verify with IB</button>
      <span class="sp"></span>
      <a class="topLink" href="ai-trade-assistant.html">General AI Assistant →</a>
    </header>

    <div class="scroll" id="scrollArea">
      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>

    <div class="case" id="caseBox"><div class="caseIn" id="caseIn"></div></div>

    <div class="review" id="review">
      <div class="reviewIn">
        <h4>Check what I heard</h4>
        <p>Numbers matter — please confirm the prices before this is sent.</p>
        <label class="sr-only" for="reviewText">Edit the transcribed message</label>
        <textarea id="reviewText" rows="2"></textarea>
        <div class="rb">
          <button class="primary" id="rSend" type="button">Looks right — send</button>
          <button id="rRetry" type="button">Record again</button>
          <button id="rCancel" type="button">Discard</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="cwrap">
        <div class="cbox">
          <button class="icon" id="mic" type="button" aria-label="Start voice input" title="Speak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4M8 21h8"/>
            </svg>
          </button>
          <label class="sr-only" for="in">Describe your open trade</label>
          <textarea id="in" rows="1" placeholder="Describe your open trade — instrument, entry, stop…" autocomplete="off"></textarea>
          <button id="send" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="cfoot">
          <label for="lang" class="sr-only">Language</label>
          <select id="lang" title="Language for voice input and spoken replies">
            <option value="en-US">English</option>
            <option value="ur-PK">اردو</option>
            <option value="ar-SA">العربية</option>
          </select>
          <span class="vs" id="vs" aria-live="assertive"></span>
          <span class="right">Decision-support only — never a guaranteed outcome.</span>
          <span class="verr" id="verr" role="alert"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/ztu-premium-card.js" defer></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   ZTU RESCUE — client

   ACCESS: reuses the site's EXISTING member gate with no additions. The
   identity token minted by /api/ai-access after the Library OTP flow lives in
   localStorage['ztu_ai_identity']; it is sent with every request and the server
   resolves the tier with the SAME resolveTier() the AI assistant uses, counting
   guests in the SAME signed ztu_ai_guest cookie against the SAME
   AI_VISITOR_MESSAGE_LIMIT (5). Verification is handled by the existing shared
   ZTUPremiumCard — one identity across Library, Journal, AI and Rescue. There
   is no second auth system, no second OTP, no second counter here.

   HISTORY: browser-local only, under a key of its own so Rescue history and
   general-chatbot history never mix. Nothing is sent to a server and nothing
   about an open position is persisted beyond this browser.

   VOICE: the browser-native Web Speech API implementation is carried over
   unchanged — recognition, transcript review, numeric confirmation and
   speechSynthesis playback.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
'use strict';

const API = '/api/trade-rescue';
const HIST_KEY = 'ztu_rescue_hist_v1';    // deliberately NOT the assistant's key
const LANG_KEY = 'ztu_rescue_lang';
const IDENTITY_KEY = 'ztu_ai_identity';   // the EXISTING shared identity token

const $ = (id) => document.getElementById(id);
const thread = $('thread'), input = $('in'), sendBtn = $('send'), mic = $('mic');
const caseBox = $('caseBox'), caseIn = $('caseIn'), histList = $('histList');
const review = $('review'), reviewText = $('reviewText');
const vs = $('vs'), verr = $('verr'), langSel = $('lang'), scrollArea = $('scrollArea');
const accBadge = $('accBadge'), verifyBtn = $('verifyBtn');
const side = $('side'), scrim = $('scrim'), burger = $('burger');

let convo = null;        // {id, title, turns:[], tradeCase:{}}
let busy = false;
let tier = 'visitor';
let freeLimit = 5;       // replaced by the server's real allowance on first reply

/* ── language ──────────────────────────────────────────────────────────── */
try { const s = localStorage.getItem(LANG_KEY); if (s) langSel.value = s; } catch {}
langSel.addEventListener('change', () => {
  try { localStorage.setItem(LANG_KEY, langSel.value); } catch {}
  if (rec) rec.lang = langSel.value;
});
const replyLang = () => ({ 'en-US':'en','ur-PK':'ur','ar-SA':'ar' })[langSel.value] || 'en';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function md(src) {
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+?)\*/g, '$1<em>$2</em>')
    .replace(/_([^_]+?)_/g, '<em>$1</em>')
    .replace(/`([^`]+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  let out = '', list = false;
  for (const raw of String(src || '').split('\n')) {
    const line = raw.trim();
    if (!line) { if (list) { out += '</ul>'; list = false; } continue; }
    const h = /^#{2,4}\s+(.*)$/.exec(line);
    if (h) { if (list) { out += '</ul>'; list = false; } out += '<h3>' + inline(h[1]) + '</h3>'; continue; }
    const li = /^[-•]\s+(.*)$/.exec(line);
    if (li) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    out += '<p>' + inline(line) + '</p>';
  }
  return list ? out + '</ul>' : out;
}

/* ── history (browser-local) ───────────────────────────────────────────── */
function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; } }
function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 40))); } catch {} }
function persist() {
  if (!convo || !convo.turns.length) return;
  const h = loadHist().filter(c => c.id !== convo.id);
  h.unshift(convo); saveHist(h); renderHist();
}
function renderHist() {
  const h = loadHist();
  histList.innerHTML = h.length ? '' : '<div style="padding:8px 10px;font-size:12.5px;color:var(--muted2)">No analyses yet.</div>';
  for (const c of h) {
    const b = document.createElement('button');
    b.className = 'hitem' + (convo && c.id === convo.id ? ' on' : '');
    b.type = 'button';
    b.innerHTML = '<span></span><button class="del" type="button" aria-label="Delete">×</button>';
    b.querySelector('span').textContent = c.title || 'Untitled analysis';
    b.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        saveHist(loadHist().filter(x => x.id !== c.id));
        if (convo && convo.id === c.id) newConvo(); else renderHist();
        return;
      }
      openConvo(c);
    });
    histList.appendChild(b);
  }
}
function newConvo() {
  convo = { id: 'c' + Date.now(), title: '', turns: [], tradeCase: {} };
  thread.innerHTML = ''; renderCase({}); closeReview(); stopSpeak();
  greet(); renderHist(); closeSide();
}
function openConvo(c) {
  convo = JSON.parse(JSON.stringify(c));
  thread.innerHTML = ''; stopSpeak();
  for (const t of convo.turns) {
    if (t.role === 'me') addMe(t.text, t.voice, false);
    else addAI(t.text, t.evidence, false, t.gate);
  }
  renderCase(convo.tradeCase); renderHist(); closeSide();
}

/* ── rendering ─────────────────────────────────────────────────────────── */
function addMe(text, spoken, record) {
  const t = document.createElement('div'); t.className = 'turn me';
  if (spoken) { const m = document.createElement('div'); m.className = 'mic-tag'; m.textContent = 'Spoken'; t.appendChild(m); }
  const d = document.createElement('div'); d.className = 'txt'; d.textContent = text;
  t.appendChild(d); thread.appendChild(t); scrollDown();
  if (record !== false) {
    convo.turns.push({ role: 'me', text, voice: !!spoken });
    if (!convo.title) { convo.title = text.slice(0, 46) + (text.length > 46 ? '…' : ''); }
  }
}
function addAI(markdown, evidence, record, gate) {
  const t = document.createElement('div'); t.className = 'turn ai';
  const d = document.createElement('div'); d.className = 'txt';

  if (gate) {
    d.innerHTML = '<div class="gate"><h4>' + esc(gate.title) + '</h4><p>' + esc(gate.headline) + '</p>'
      + '<ul>' + (gate.steps || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>'
      + '<div class="gb"><button class="primary" id="gateVerify" type="button">' + esc(gate.verifyCta ? gate.verifyCta.label : 'Verify now') + '</button>'
      + '<a class="ghost" href="' + esc(gate.cta ? gate.cta.url : 'license-request.html') + '">' + esc(gate.cta ? gate.cta.label : 'Join IB') + '</a></div>'
      + '<p style="margin:10px 0 0;font-size:12px">' + esc(gate.freeNotice || '') + '</p></div>';
  } else {
    d.innerHTML = md(markdown);
  }

  if (evidence) {
    const det = document.createElement('details'); det.className = 'prov';
    let h = '';
    for (const l of (evidence.provenance || [])) h += '<div>' + esc(l) + '</div>';
    for (const u of (evidence.unavailable || [])) h += '<div class="miss">⚠ ' + esc(u) + '</div>';
    det.innerHTML = '<summary>Sources &amp; timestamps</summary><div class="body">' + (h || '<div>No external data was used for this turn.</div>') + '</div>';
    d.appendChild(det);
  }
  t.appendChild(d);

  if (!gate && TTS_OK && markdown) {
    const acts = document.createElement('div'); acts.className = 'rowacts';
    const b = document.createElement('button');
    b.className = 'iact'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '🔊 Listen';
    b.addEventListener('click', () => toggleSpeak(b, markdown));
    acts.appendChild(b);
    const cp = document.createElement('button');
    cp.className = 'iact'; cp.type = 'button'; cp.textContent = 'Copy';
    cp.addEventListener('click', () => { try { navigator.clipboard.writeText(markdown); cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy', 1400); } catch {} });
    acts.appendChild(cp);
    t.appendChild(acts);
  }
  thread.appendChild(t); scrollDown();
  if (gate) { const gv = $('gateVerify'); if (gv) gv.addEventListener('click', openVerify); }
  if (record !== false) convo.turns.push({ role: 'ai', text: markdown, evidence, gate });
}
function scrollDown() { scrollArea.scrollTop = scrollArea.scrollHeight; }

function showState(label, kind) {
  hideState();
  const t = document.createElement('div'); t.className = 'turn ai'; t.id = 'stateT';
  t.innerHTML = '<div class="state">' + (kind === 'rec' ? '<span class="rec-dot"></span>' : '<span class="dots"><i></i><i></i><i></i></span>')
    + '<span>' + esc(label) + '</span></div>';
  thread.appendChild(t); scrollDown();
}
function hideState() { const t = $('stateT'); if (t) t.remove(); }

function renderCase(c) {
  if (convo) convo.tradeCase = c || {};
  const out = [];
  const chip = (l, v, cls) => { if (v !== null && v !== undefined && v !== '')
    out.push('<span class="chip ' + (cls || '') + '"><b>' + esc(l) + '</b><s>' + esc(v) + '</s></span>'); };
  chip('Instrument', c && c.instrument);
  chip('Direction', c && c.direction ? c.direction.toUpperCase() : null);
  chip('Entry', c && c.entry);
  if (c && c.has_stop_loss === false) chip('Stop Loss', 'None', 'alert'); else chip('Stop Loss', c && c.stop_loss);
  chip('Take Profit', c && c.take_profit);
  chip('Entry TF', c && c.timeframe_entry);
  chip('Holding', c && c.holding_duration);
  chip('Size', c && c.position_size);
  caseIn.innerHTML = out.join('');
  caseBox.classList.toggle('on', out.length > 0);
}

/* ── access badge — driven by the EXISTING member wiring ───────────────── */
function identityToken() { try { return localStorage.getItem(IDENTITY_KEY) || ''; } catch { return ''; } }

function paintAccess() {
  if (tier === 'unlimited') {
    accBadge.className = 'acc ok';
    accBadge.innerHTML = '✓ <b>Verified</b><span class="detail"> · Unlimited</span>';
    verifyBtn.hidden = true;
  } else {
    accBadge.className = 'acc no';
    accBadge.innerHTML = '× <b>Unverified</b><span class="detail"> · ' + freeLimit + ' free analyses</span>';
    verifyBtn.hidden = false;
  }
}

/* Validate the existing token with the existing endpoint — no new auth. */
async function refreshAccess() {
  const tok = identityToken();
  if (!tok) { tier = 'visitor'; paintAccess(); return; }
  try {
    const r = await fetch('/api/ai-access', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'session', token: tok, lang: replyLang() }),
    });
    const d = await r.json().catch(() => ({}));
    tier = (d && d.ok && d.tier === 'unlimited') ? 'unlimited' : 'visitor';
  } catch { tier = identityToken() ? 'unlimited' : 'visitor'; }
  paintAccess();
}

/* Verification uses the SAME shared premium card every other surface uses. */
function openVerify() {
  if (window.ZTUPremiumCard && typeof window.ZTUPremiumCard.open === 'function') {
    window.ZTUPremiumCard.open({ entry: 'ai', dismissible: true, onApproved: () => { refreshAccess(); } });
  } else {
    window.location.href = 'license-request.html';
  }
}
verifyBtn.addEventListener('click', openVerify);

/* ── text to speech ────────────────────────────────────────────────────── */
const TTS_OK = ('speechSynthesis' in window);
let speakingBtn = null;
const BCP47 = { en:'en-US', ur:'ur-PK', ar:'ar-SA' };
function ttsText(s) {
  return String(s || '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/https?:\/\/\S+/g, ' ').replace(/[#*_`>~|]/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 2200);
}
function stopSpeak() {
  try { speechSynthesis.cancel(); } catch {}
  if (speakingBtn) { speakingBtn.innerHTML = '🔊 Listen'; speakingBtn.setAttribute('aria-pressed','false'); speakingBtn = null; }
}
function toggleSpeak(btn, src) {
  if (speakingBtn === btn) { stopSpeak(); return; }
  stopSpeak();
  const text = ttsText(src); if (!text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = BCP47[replyLang()] || 'en-US';
    const vlist = speechSynthesis.getVoices() || [];
    const base = u.lang.split('-')[0];
    const v = vlist.find(x => x.lang === u.lang) || vlist.find(x => x.lang && x.lang.indexOf(base) === 0);
    if (v) u.voice = v;
    u.onend = () => { if (speakingBtn === btn) stopSpeak(); };
    u.onerror = () => { stopSpeak(); showErr('Playback failed — you can still read the answer.'); };
    speakingBtn = btn; btn.innerHTML = '⏹ Stop'; btn.setAttribute('aria-pressed','true');
    speechSynthesis.speak(u);
  } catch { stopSpeak(); showErr('Speech playback is not available in this browser.'); }
}
if (TTS_OK) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch {} }

/* ── speech to text ────────────────────────────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalTxt = '';
function showVs(l, kind) { vs.classList.add('on'); vs.innerHTML = (kind === 'rec' ? '<span class="rec-dot"></span>' : '') + esc(l); }
function hideVs() { vs.classList.remove('on'); vs.innerHTML = ''; }
function showErr(m) { verr.textContent = m; verr.classList.add('on'); setTimeout(() => verr.classList.remove('on'), 7000); }

if (!SR) {
  mic.disabled = true;
  mic.title = 'Voice input is not supported in this browser. Try Chrome, Edge or Safari — or just type.';
  mic.setAttribute('aria-label', mic.title);
} else {
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1; rec.lang = langSel.value;
  rec.onstart = () => { listening = true; mic.classList.add('rec');
    mic.setAttribute('aria-label','Stop recording'); showState('Listening…','rec'); showVs('Listening','rec'); };
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const c = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTxt += c + ' '; else interim += c;
    }
    if (interim) showState('Listening… “' + interim.trim().slice(0, 64) + '”', 'rec');
  };
  rec.onerror = (e) => {
    listening = false; mic.classList.remove('rec'); hideState(); hideVs();
    const err = e && e.error;
    showErr(err === 'not-allowed' || err === 'service-not-allowed'
      ? 'Microphone permission denied. Allow it in your browser settings, or type instead.'
      : err === 'no-speech' ? 'I didn’t catch anything — try again, or type it.'
      : err === 'audio-capture' ? 'No microphone found. Please type instead.'
      : err === 'network' ? 'Speech recognition needs a network connection. You can type instead.'
      : 'Voice input failed. You can type instead.');
  };
  rec.onend = () => {
    listening = false; mic.classList.remove('rec');
    mic.setAttribute('aria-label','Start voice input');
    hideState(); hideVs();
    const t = finalTxt.trim(); finalTxt = '';
    if (t) openReview(t);
  };
  mic.addEventListener('click', () => {
    if (busy) return;
    if (listening) { try { rec.stop(); } catch {} return; }
    stopSpeak(); finalTxt = ''; rec.lang = langSel.value;
    try { rec.start(); } catch { showErr('Could not start the microphone. Please type instead.'); }
  });
}

/* ── transcript review — never auto-submits a mis-heard number ──────────── */
function openReview(t) {
  reviewText.value = t; review.classList.add('on');
  reviewText.focus(); reviewText.setSelectionRange(t.length, t.length);
  showVs('Review your transcript');
}
function closeReview() { review.classList.remove('on'); reviewText.value = ''; hideVs(); }
$('rSend').addEventListener('click', () => { const t = reviewText.value.trim(); closeReview(); if (t) ask(t, true); });
$('rCancel').addEventListener('click', closeReview);
$('rRetry').addEventListener('click', () => { closeReview(); mic.click(); });
reviewText.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('rSend').click(); } });

/* ── send ──────────────────────────────────────────────────────────────── */
async function ask(text, spoken) {
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true; mic.disabled = !SR; stopSpeak();
  addMe(text, !!spoken);
  input.value = ''; input.style.height = 'auto';

  showState('Reading your trade…');
  const t1 = setTimeout(() => showState('Pulling current market data…'), 700);
  const t2 = setTimeout(() => showState('Analysing the evidence…'), 2400);

  try {
    const res = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        tradeCase: (convo && convo.tradeCase) || {},
        lang: replyLang(),
        viaVoice: !!spoken,
        identityToken: identityToken(),   // the EXISTING shared token
      }),
    });
    clearTimeout(t1); clearTimeout(t2); hideState();
    if (!res.ok) { addAI('Something went wrong reaching the analysis service (HTTP ' + res.status + '). Please try again.'); return; }
    const d = await res.json();
    if (d.tier) { tier = d.tier; paintAccess(); }
    if (d.mode === 'limit') { addAI('', null, true, d.gate); persist(); return; }
    renderCase(d.tradeCase);
    addAI(d.reply, d.mode === 'analysis' ? d.evidence : null, true);
    persist();
  } catch {
    clearTimeout(t1); clearTimeout(t2); hideState();
    addAI('Could not reach the analysis service. Check your connection and try again.');
  } finally {
    busy = false; sendBtn.disabled = false; mic.disabled = !SR; input.focus();
  }
}

sendBtn.addEventListener('click', () => ask(input.value, false));
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value, false); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });

/* ── sidebar ───────────────────────────────────────────────────────────── */
function openSide() { side.classList.add('open'); scrim.classList.add('open'); burger.setAttribute('aria-expanded','true'); }
function closeSide() { side.classList.remove('open'); scrim.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }
burger.addEventListener('click', () => side.classList.contains('open') ? closeSide() : openSide());
scrim.addEventListener('click', closeSide);
$('newBtn').addEventListener('click', newConvo);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSide(); closeReview(); } });

/* ── boot ──────────────────────────────────────────────────────────────── */
function greet() {
  addAI([
    "I'm **ZTU Rescue**. Tell me about a trade you're already in and I'll work through it with you.",
    SR ? '\nType it, or press the microphone and just say it.' : '',
  ].join('\n'), null, false);
}

newConvo();
refreshAccess();

/* Homepage hand-off — the same ?q=…&send=1 contract the assistant accepted, so
   the existing link shape keeps working. */
try {
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  if (q) {
    input.value = q;
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    if (p.get('send') === '1') setTimeout(() => ask(q, false), 60);
  }
} catch {}

})();
</script>
