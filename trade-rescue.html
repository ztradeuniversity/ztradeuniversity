<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZTU Rescue — Structured Trade Assessment</title>
<meta name="description" content="ZTU Rescue — describe your open position, and get a structured, evidence-based trade-management assessment built from verified market data." />
<link rel="icon" href="assets/ztu-logo.png" />
<style>
  /* ══ ZTU RESCUE — STRUCTURED TRADE ASSESSMENT ══════════════════════════════
     A premium analytics intake, not a chat. The trader states the position
     once; the system fetches everything else itself. Light, spacious, restrained
     gold accent — the ZTU palette, nothing decorative competing with the data. */
  :root{
    --bg:#ffffff; --bg2:#f7f7f8; --side:#fafafa; --panel:#fcfcfd;
    --line:#e8e8ea; --line2:#dcdce0;
    --text:#17181c; --muted:#63656e; --muted2:#8e919b;
    --accent:#c8891f; --accent2:#a9711a; --accent-soft:#fdf7ea;
    --ok:#177245; --ok-bg:#eaf5ef; --warn:#8a6100; --warn-bg:#fdf3e0;
    --bear:#b03a3a; --bear-bg:#fdeced; --bull:#177245;
    --r:14px; --side-w:264px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ── sidebar ── */
  aside{width:var(--side-w);flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:transform .22s}
  .newBtn{margin:14px;padding:11px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--bg);
    font:600 14px/1 inherit;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left}
  .newBtn:hover{border-color:var(--accent);color:var(--accent2)}
  .sideHead{padding:6px 18px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .histList{flex:1;overflow-y:auto;padding:2px 10px 14px}
  .histItem{position:relative}
  .histItem button.histSelect{width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 34px 9px 10px;
    cursor:pointer;font:inherit;color:var(--text);display:block}
  [dir=rtl] .histItem button.histSelect{text-align:right;padding:9px 10px 9px 34px}
  .histItem button.histSelect:hover{background:var(--bg2)}
  .histItem button.histSelect b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .histItem button.histSelect span{font-size:11.5px;color:var(--muted2)}
  .histDel{position:absolute;top:7px;inset-inline-end:6px;width:24px;height:24px;border:0;background:transparent;border-radius:7px;
    color:var(--muted2);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:.15s}
  .histItem:hover .histDel,.histItem:focus-within .histDel{opacity:1}
  .histDel:hover,.histDel:focus{background:var(--bear-bg);color:var(--bear);opacity:1}
  .sideFoot{padding:12px 18px;border-top:1px solid var(--line);font-size:12px}
  .sideFoot a{color:var(--muted);text-decoration:none}
  .sideFoot a:hover{color:var(--accent2)}
  .sideScrim{display:none}

  /* ── main ── */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header.bar{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
  .burger{display:none;width:34px;height:34px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);cursor:pointer;
    align-items:center;justify-content:center;flex-shrink:0}
  .brand{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .brand span{color:var(--accent)}
  .acc{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .acc.ok{background:var(--ok-bg);color:var(--ok)}
  .acc.no{background:var(--warn-bg);color:var(--warn)}
  .verifyBtn{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .verifyBtn:hover{background:var(--accent2);border-color:var(--accent2)}
  .navGroup{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .navBtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid var(--line2);
    border-radius:9px;background:var(--bg);color:var(--text);font:600 12.5px/1 inherit;cursor:pointer;
    white-space:nowrap;text-decoration:none;flex-shrink:0}
  .navBtn:hover{border-color:var(--accent);color:var(--accent2)}
  .navBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .navBtn svg{flex-shrink:0}
  [dir=rtl] .navBtn.back svg{transform:scaleX(-1)}
  .sp{flex:1}
  .langWrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 10px}
  .langWrap select{border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;outline:none}

  .scroll{flex:1;overflow-y:auto}
  .wrap{max-width:860px;margin:0 auto;padding:26px 22px 64px}

  /* ── one-page sections ── */
  .secHead{display:flex;align-items:center;gap:10px;margin:32px 0 13px;
    font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .secHead::after{content:'';flex:1;height:1px;background:var(--line)}
  .secNo{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent2);font-size:10.5px;font-weight:800;letter-spacing:0}
  .opt{font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);
    background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-inline-start:5px}
  .segs.slim button{padding:9px 14px;flex:0 0 auto;min-width:132px}
  .segs.slim button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
  .layers{margin-bottom:12px}
  .tf{margin-bottom:16px}
  .submitRow{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  .btn.big{width:100%;padding:15px 20px;font-size:15px;border-radius:12px}
  h1{font-size:25px;line-height:1.25;letter-spacing:-.02em;margin:0 0 8px}
  .lede{color:var(--muted);font-size:14.5px;margin:0 0 24px;max-width:62ch}

  .card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .req{color:var(--accent2)}
  input[type=text],input[type=number],input[type=date],textarea,select.f{
    width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--bg);padding:10px 12px;
    font:inherit;font-size:14.5px;color:var(--text);outline:none;transition:.15s}
  input:focus,textarea:focus,select.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,137,31,.1)}
  textarea{resize:vertical;min-height:76px}
  .hint{font-size:11.5px;color:var(--muted2);margin-top:5px}
  .sideHint{font-size:11px;color:var(--muted2);margin:6px 0 0;line-height:1.4}

  /* choice tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{border:1.5px solid var(--line2);border-radius:12px;background:var(--bg);padding:16px;cursor:pointer;
    text-align:left;font:inherit;transition:.15s;display:flex;flex-direction:column;gap:3px}
  .tile:hover{border-color:var(--accent)}
  .tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(200,137,31,.09)}
  .tile b{font-size:15px}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.buy.on{border-color:var(--bull);background:var(--ok-bg);box-shadow:0 0 0 3px rgba(23,114,69,.09)}
  .tile.sell.on{border-color:var(--bear);background:var(--bear-bg);box-shadow:0 0 0 3px rgba(176,58,58,.09)}

  /* layers */
  .layer{border:1px solid var(--line2);border-radius:12px;background:var(--bg);padding:15px;margin-bottom:12px;position:relative}
  .layer h4{margin:0 0 12px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .layer .del{position:absolute;top:11px;inset-inline-end:11px;border:0;background:transparent;color:var(--muted2);
    cursor:pointer;font-size:17px;line-height:1;padding:3px 6px;border-radius:7px}
  .layer .del:hover{background:var(--bear-bg);color:var(--bear)}
  .segs{display:flex;gap:6px}
  .segs button{flex:1;border:1.5px solid var(--line2);background:var(--bg);border-radius:9px;padding:8px;
    font:600 13px/1 inherit;color:var(--muted);cursor:pointer}
  .segs button.on[data-d=buy]{border-color:var(--bull);background:var(--ok-bg);color:var(--bull)}
  .segs button.on[data-d=sell]{border-color:var(--bear);background:var(--bear-bg);color:var(--bear)}
  .addLayer{width:100%;border:1.5px dashed var(--line2);background:transparent;border-radius:12px;padding:13px;
    font:600 13.5px/1 inherit;color:var(--accent2);cursor:pointer}
  .addLayer:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* voice */
  .vrow{display:flex;gap:8px;align-items:flex-start}
  .vrow textarea{flex:1}
  .mic{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid var(--line2);background:var(--bg);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .mic:hover:not([disabled]){border-color:var(--accent);color:var(--accent2)}
  .mic[disabled]{opacity:.35;cursor:not-allowed}
  .mic.rec{background:var(--bear-bg);border-color:var(--bear);color:var(--bear)}
  .mic svg{width:18px;height:18px}
  .vnote{font-size:11.5px;color:var(--accent2);margin-top:6px;min-height:16px}

  /* nav */
  .nav{display:flex;gap:10px;margin-top:22px;align-items:center}
  .btn{border:1px solid var(--line2);background:var(--bg);border-radius:11px;padding:11px 20px;
    font:600 14px/1 inherit;color:var(--text);cursor:pointer;transition:.15s}
  .btn:hover:not([disabled]){border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not([disabled]){background:var(--accent2);border-color:var(--accent2)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .navSp{flex:1}
  .err{color:var(--bear);font-size:12.5px;margin-top:10px;min-height:18px}

  /* review */
  .rev{font-size:14px}
  .rev table{width:100%;border-collapse:collapse}
  .rev th,.rev td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
  .rev th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700}

  /* ── results ── */
  .rHead{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;margin-bottom:16px}
  .rTop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .rTop h2{margin:0;font-size:21px;letter-spacing:-.02em}
  .rTop .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent2)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--bg)}
  .stat i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:4px}
  .stat b{font-size:17px;font-weight:700;letter-spacing:-.01em;display:block}
  .stat u{display:block;text-decoration:none;font-size:11px;color:var(--muted2);margin-top:3px}
  .stat.pos b{color:var(--bull)} .stat.neg b{color:var(--bear)}

  .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .meter{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px}
  .meter h5{margin:0 0 3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .meter .lean{font-size:15.5px;font-weight:700;margin-bottom:9px;text-transform:capitalize}
  .meter .lean.bullish{color:var(--bull)} .meter .lean.bearish{color:var(--bear)} .meter .lean.neutral{color:var(--muted)}
  .track{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#f2dcdc,#eeeeee,#dcefe4);margin:0 0 8px}
  .track .pin{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--bg);
    border:2.5px solid var(--muted);transform:translateX(-50%);transition:.3s}
  .track .pin.bullish{border-color:var(--bull)} .track .pin.bearish{border-color:var(--bear)}
  .meter .sub{font-size:11px;color:var(--muted2);display:flex;justify-content:space-between;gap:6px}

  /* evidence — always expanded, FACT / IMPACT / SCORE per row (§1, §2, §4) */
  .meter .measured{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .meter .measured .capt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:7px}
  .evRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .evRow:last-child{border-bottom:0}
  .evText{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.55}
  .evText .impact{display:inline-block;margin-inline-start:6px;font-size:10px;font-weight:700;letter-spacing:.02em;padding:1.5px 7px;border-radius:20px;white-space:nowrap}
  .evText .impact.supportive{background:var(--ok-bg);color:var(--ok)}
  .evText .impact.opposing{background:var(--bear-bg);color:var(--bear)}
  .evText .impact.neutral{background:var(--bg2);color:var(--muted2)}
  .scoreWrap{position:relative;display:inline-block;flex-shrink:0}
  .scoreBtn{border:1.5px solid var(--line2);background:var(--bg);border-radius:8px;min-width:34px;height:26px;padding:0 7px;
    font:800 12.5px/1 inherit;cursor:help;color:var(--muted);direction:ltr}
  .scoreBtn.pos{border-color:var(--bull);color:var(--bull);background:var(--ok-bg)}
  .scoreBtn.neg{border-color:var(--bear);color:var(--bear);background:var(--bear-bg)}
  .scoreBtn.zero{border-color:var(--line2);color:var(--muted)}
  .scoreTip{display:none;position:absolute;z-index:20;bottom:calc(100% + 8px);inset-inline-end:0;width:200px;max-width:65vw;
    background:var(--text);color:#fff;font-size:11.5px;line-height:1.5;padding:9px 11px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);
    text-align:start}
  .scoreWrap:hover .scoreTip,.scoreWrap:focus-within .scoreTip{display:block}
  .unavailLine{font-size:11.5px;color:var(--muted2);font-style:italic;padding:6px 0 0}

  /* evidence impact cards — FACT / IMPACT ON INSTRUMENT / WHY / TRADE EFFECT */
  .impactWrap{margin-bottom:16px}
  .impactCard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px 18px;margin-bottom:12px}
  .impactCard:last-child{margin-bottom:0}
  .impactCard h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .impactRow{padding:10px 0;border-bottom:1px dashed var(--line)}
  .impactRow:last-child{border-bottom:0}
  .impactFact{font-size:13.5px;line-height:1.5;margin-bottom:6px}
  .impactMeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:5px}
  .impactBadge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .impactBadge.bullish{background:var(--ok-bg);color:var(--ok)}
  .impactBadge.bearish{background:var(--bear-bg);color:var(--bear)}
  .impactBadge.neutral{background:var(--bg2);color:var(--muted2)}
  .impactTag{font-size:11.5px;font-weight:600;color:var(--muted)}
  .impactReason{font-size:12px;color:var(--muted2);line-height:1.5}
  .impactPlain{font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px dashed var(--line)}
  .impactPlain:last-child{border-bottom:0}
  .impactUnavail{font-size:11.5px;color:var(--muted2);font-style:italic;padding:6px 0 0}

  /* evidence section header — label + meter lean/coverage, consolidated with
     the FACT/IMPACT/REASON/TRADE-EFFECT rows below it so nothing is stated
     in two separate cards any more */
  .secHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .secHead h4{margin:0}
  .secLean{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .secLean.bullish{color:var(--bull)} .secLean.bearish{color:var(--bear)} .secLean.neutral{color:var(--muted)}
  .secCov{font-size:11px;color:var(--muted2)}

  /* upcoming economic data — event rows (distinct shape from the FACT/IMPACT
     evidence rows: what/when, what it means, both scenarios, trade relevance) */
  .eventRow{padding:10px 0;border-bottom:1px dashed var(--line)}
  .eventRow:last-child{border-bottom:0}
  .eventWhat{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px}
  .eventWhen{font-size:11.5px;color:var(--muted2);margin-bottom:6px}
  .eventLine{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
  .eventLine b{color:var(--muted);font-weight:700}

  /* five-factor evidence snapshot (§9) */
  .snapshotCard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px 18px;margin-bottom:16px}
  .snapshotRow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .snapshotRow:last-child{border-bottom:0}
  .snapshotLabel{color:var(--muted2);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
  .snapshotWord{font-weight:800}
  .snapshotWord.bullish{color:var(--bull)} .snapshotWord.bearish{color:var(--bear)} .snapshotWord.neutral{color:var(--muted)}
  .snapshotOverall{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--text)}

  /* final mentor review — visually the strongest card on the page (§23) */
  .mentorCard{border:1.5px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);padding:24px 26px;margin-bottom:16px}
  .mentorCard h3{margin:0 0 12px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent2)}
  .mentorProse{font-size:15.5px;line-height:1.65;color:var(--text);margin:0 0 16px;white-space:pre-line}
  .mentorRow{font-size:13.5px;line-height:1.6;margin-bottom:7px;color:var(--text)}
  .mentorRow b{color:var(--accent2)}
  .mentorDisclaimer{font-size:11.5px;color:var(--muted2);font-style:italic;margin-top:14px;padding-top:14px;border-top:1px solid rgba(247,147,26,.22)}

  /* management fit badge — a rating, deliberately NOT styled like the
     bullish/bearish evidence badges, so it can never be mistaken for one */
  .fitBadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 11px;
    border-radius:20px;background:var(--bg2);color:var(--text);border:1px solid var(--line2);cursor:help}

  /* overall evidence + market direction (§5, §6) */
  .overallCard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px 20px;margin-bottom:16px}
  .overallTop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .overallScoreWrap{text-align:center;min-width:52px}
  .overallScore{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;direction:ltr}
  .overallScore.pos{color:var(--bull)} .overallScore.neg{color:var(--bear)} .overallScore.zero{color:var(--muted)}
  .overallLabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-top:3px}
  .overallHead{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .overallText{font-size:13.5px;color:var(--text)}
  .mdRow{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .mdRow .mdHead{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:5px}
  .mdRow .mdLine{font-size:14.5px;font-weight:600;margin-bottom:6px}
  .mdRow ul{margin:0;padding-inline-start:18px;font-size:12px;color:var(--muted)}
  .mdRow ul li{margin-bottom:3px}

/* ── ACCESS — the EXISTING shared member wiring, unchanged ──────────────── */
const ACCT_KEY = 'ztu_ai_acct', VERIFIED_KEY = 'ztu_ai_verified', LIB_KEY = 'ztu_lib_v3';
const LIB_TTL = 15 * 24 * 60 * 60 * 1000;
function identityToken() { try { return localStorage.getItem(IDENTITY_KEY) || ''; } catch { return ''; } }
function setIdentityToken(x) { try { localStorage.setItem(IDENTITY_KEY, x); } catch {} }
function markVerified(a) { try { if (a) localStorage.setItem(ACCT_KEY, a); localStorage.setItem(VERIFIED_KEY, '1'); } catch {} }
function clearIdentity() { try { localStorage.removeItem(IDENTITY_KEY); localStorage.removeItem(VERIFIED_KEY); } catch {} }
function storedAcct() { try { return localStorage.getItem(ACCT_KEY) || ''; } catch { return ''; } }
function readLibSession() {
  try {
    const v = JSON.parse(localStorage.getItem(LIB_KEY) || 'null');
    if (!v || !v.account || !v.createdAt) return null;
    if (Date.now() - v.createdAt > LIB_TTL) { localStorage.removeItem(LIB_KEY); return null; }
    return v;
  } catch { return null; }
}
function writeLibSession(account) {
  const a = String(account || '').trim(); if (!a) return;
  try { const ex = readLibSession(); if (ex && ex.account === a) return;
    localStorage.setItem(LIB_KEY, JSON.stringify({ account: a, createdAt: Date.now() })); } catch {}
}
function clearLibSession() { try { localStorage.removeItem(LIB_KEY); } catch {} }

  } else {
    accBadge.className = 'acc no';
    accBadge.innerHTML = '× <b>Unverified</b><span class="detail"> · ' + freeLimit + ' free</span>';
    verifyBtn.hidden = false;
  }
}
function applyTier(next) {
  const was = tier;
  tier = next === 'unlimited' ? 'unlimited' : 'visitor';
  paintAccess();
  if (tier === 'unlimited' && was !== 'unlimited') {
    document.querySelectorAll('.gate').forEach((n) => n.remove());
  }
}
async function aiAccess(payload) {
  try {
    const r = await fetch('/api/ai-access', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, lang: lang() }),
    });
    return await r.json().catch(() => ({}));
  } catch { return {}; }
}
async function bridgeFromLibrary() {
  const lib = readLibSession(); if (!lib) return false;
  const d = await aiAccess({ action: 'bridge', account: lib.account, sessionStart: lib.createdAt });
  if (d.valid && d.token) { setIdentityToken(d.token); markVerified(lib.account); return true; }
  if (d.valid === false) clearLibSession();
  return false;
}
async function refreshAccess() {
  try {
    if (!identityToken()) await bridgeFromLibrary();
    const tok = identityToken();
    if (!tok) { applyTier('visitor'); return; }
    const d = await aiAccess({ action: 'session', token: tok });
    if (d.valid && d.tier === 'unlimited') {
      if (d.token) setIdentityToken(d.token);
      markVerified(storedAcct()); writeLibSession(storedAcct());
      applyTier('unlimited'); return;
    }
    if (d.removed) { clearIdentity(); clearLibSession(); }
    applyTier('visitor');
  } catch { paintAccess(); }
}
function openVerify() {
  if (window.ZTUPremiumCard && typeof window.ZTUPremiumCard.open === 'function') {
    window.ZTUPremiumCard.open({
      entry: 'rescue', dismissible: true,
      onApproved: async (result) => {
        const acct = result && result.account;
        if (acct) {
          markVerified(acct); writeLibSession(acct);
          const lib = readLibSession();
          const d = await aiAccess({ action: 'bridge', account: acct, sessionStart: (lib && lib.createdAt) || Date.now() });
          if (d.valid && d.token) { setIdentityToken(d.token); applyTier('unlimited'); return; }
        }
        await refreshAccess();
      },
    });
  } else window.location.href = 'license-request.html';
}
verifyBtn.addEventListener('click', openVerify);

/* ── VOICE — fills structured fields, never bypasses them ────────────────
   The transcript lands in the field as an editable draft. Numbers spoken as
   words are normalised server-side by the semantic layer and shown back for
   confirmation; nothing ambiguous is committed silently. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const BCP47 = { en: 'en-US', ur: 'ur-PK', ar: 'ar-SA' };
let rec = null, recTarget = null, recBase = '', recFinal = '';

function micButton(targetId, note) {
  return '<button class="mic" type="button" data-mic="' + targetId + '"' + (SR ? '' : ' disabled') +
    ' aria-label="' + esc(note || 'Dictate') + '" title="' + esc(note || 'Dictate') + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">' +
    '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4M8 21h8"/></svg></button>';
}
function startDictation(btn, targetId) {
  if (!SR) return;
  const el = $(targetId); if (!el) return;
  if (rec && recTarget === targetId) { try { rec.stop(); } catch {} return; }
  if (rec) { try { rec.abort(); } catch {} }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = BCP47[lang()] || 'en-US';
  recTarget = targetId; recBase = el.value.trim(); recFinal = '';
  rec.onstart = () => btn.classList.add('rec');
  rec.onresult = (e) => {
    let fin = '', interim = '';
    for (let i = 0; i < e.results.length; i++) {
      const c = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += c + ' '; else interim += c + ' ';
    }
    recFinal = fin.trim();
    el.value = [recBase, recFinal, interim.trim()].filter(Boolean).join(' ').trim();
    autoGrow(el);
  };
  rec.onerror = () => { btn.classList.remove('rec'); };
  rec.onend = () => {
    btn.classList.remove('rec');
    el.value = [recBase, recFinal].filter(Boolean).join(' ').trim();
    autoGrow(el); el.focus();
    rec = null; recTarget = null;
    syncFromDom();
  };
  try { rec.start(); } catch { btn.classList.remove('rec'); rec = null; recTarget = null; }
}
function autoGrow(el) {
  if (el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 220) + 'px';
}

/* ── ONE-PAGE INTAKE ──────────────────────────────────────────────────────
   Everything the assessment needs, on one scrollable page, with a single
   action at the bottom. No step navigation, and nothing collected that the
   analysis does not actually consume:

     · entry DATE was removed — historical entry-time context cannot be
       verified without it, and inventing a date to keep the field alive would
       be worse than reporting that one layer of evidence as unavailable;
     · layer PURPOSE was removed — a hedge is identified from opposing sides,
       not from a label the trader has to type;
     · CONTRACT SIZE was removed — the instrument convention is known and
       declared for the two supported instruments, and where it is not, results
       stay in price points rather than being converted to money on a guess.  */
const ASSETS = [
  { id: 'XAU/USD', name: 'Gold', sub: 'XAU/USD' },
  { id: 'BTC/USD', name: 'Bitcoin', sub: 'BTC/USD' },
];

function sec(n, titleKey) {
  return '<div class="secHead"><span class="secNo">' + n + '</span>' + esc(t(titleKey)) + '</div>';
}

function render() {
  document.documentElement.dir = rtl() ? 'rtl' : 'ltr';
  if (result) return renderResult();

  let h = '<h1>' + esc(t('pageTitle')) + '</h1><p class="lede">' + esc(t('pageLede')) + '</p>';

  /* A — ASSET */
  h += sec('A', 'secAsset') + '<div class="tiles">';
  for (const a of ASSETS) {
    h += '<button class="tile' + (C.instrument === a.id ? ' on' : '') + '" type="button" data-asset="' + a.id + '">' +
      '<b>' + esc(a.name) + '</b><span>' + esc(a.sub) + '</span></button>';
  }
  h += '</div>';

  /* B — POSITION LAYERS. Side (BUY/SELL) lives ONLY here now — each layer's
     own Side control is the canonical direction; a one-position assessment
     is simply a single layer, so Layer 1's side IS the position direction.
     No separate top-level direction selector exists any more (removed —
     it asked the same BUY/SELL question a second time for no reason; see
     layerHtml() for the short beginner explanation now attached to the
     control that actually remains). */
  h += sec('B', 'secPosition') +
    '<div class="segs slim" style="margin-bottom:14px">' +
    '<button type="button" data-multi="0" class="' + (C.multi === false ? 'on' : '') + '">' + esc(t('single')) + '</button>' +
    '<button type="button" data-multi="1" class="' + (C.multi === true ? 'on' : '') + '">' + esc(t('multiple')) + '</button>' +
    '</div>';
  h += '<div class="layers">' + C.layers.map(layerHtml).join('') + '</div>';
  if (C.multi) h += '<button class="addLayer" id="addLayer" type="button">' + esc(t('addLayer')) + '</button>';

  /* C — ACCOUNT / RISK */
  h += sec('C', 'secAccount') + '<div class="grid3">' +
    field('acc_start', t('startBal'), C.account.starting_balance, 'number', true) +
    field('acc_now', t('curBal'), C.account.current_balance, 'number', true) +
    field('acc_fpl', t('floatPl'), C.account.floating_pl, 'number', true) +
    '</div>';

  /* D — TRADE CONTEXT */
  h += sec('D', 'secContext') +
    textField('ctx_thesis', t('thesis'), C.context.thesis) +
    textField('ctx_concern', t('concern'), C.context.concern);

  /* SUBMIT */
  h += '<div class="submitRow">' +
    '<button class="btn primary big" id="go" type="button">' + esc(t('analyse')) + '</button>' +
    '<div class="err" id="err" role="alert"></div>' +
    '<div class="busy" id="busy"><span class="spin"></span><span id="busyText">' + esc(t('analysing')) + '</span></div>' +
    '</div>';

  view.innerHTML = h;
  wire();
}

/* `opt` marks a field visibly optional — the trader should never wonder
   whether a blank Stop Loss will block the assessment. */
function field(id, label, val, type, opt) {
  return '<div><label class="f" for="' + id + '">' + esc(label) +
    (opt ? ' <span class="opt">' + esc(t('optional')) + '</span>' : '') + '</label>' +
    '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val) + '" ' +
    (type === 'number' ? 'step="any" inputmode="decimal"' : '') + ' /></div>';
}
function textField(id, label, val) {
  return '<div class="tf"><label class="f" for="' + id + '">' + esc(label) + '</label>' +
    '<div class="vrow"><textarea id="' + id + '" rows="2">' + esc(val) + '</textarea>' + micButton(id, label) + '</div></div>';
}

/* A layer is a side and an entry price. Stop Loss and Take Profit are offered
   because they change the risk read materially; nothing else is asked. */
function layerHtml(l, i) {
  const p = (k) => 'L' + i + '_' + k;
  return '<div class="layer" data-layer="' + i + '">' +
    '<h4>' + esc(t('layer')) + ' ' + (i + 1) + '</h4>' +
    (C.multi && C.layers.length > 1 ? '<button class="del" type="button" data-del="' + i + '" aria-label="' + esc(t('remove')) + '">×</button>' : '') +
    '<div class="grid2">' +
    '<div><label class="f">' + esc(t('side')) + ' <span class="req">*</span></label>' +
    '<div class="segs"><button type="button" data-d="buy" data-seg="' + i + '" class="' + (l.direction === 'buy' ? 'on' : '') + '">' + esc(t('buy')) + '</button>' +
    '<button type="button" data-d="sell" data-seg="' + i + '" class="' + (l.direction === 'sell' ? 'on' : '') + '">' + esc(t('sell')) + '</button></div>' +
    '<p class="sideHint">' + esc(t('buy')) + ': ' + esc(t('buyD')) + ' · ' + esc(t('sell')) + ': ' + esc(t('sellD')) + '</p></div>' +
    field(p('entry'), t('entry') + ' *', l.entry, 'number') + '</div>' +
    '<div class="grid2" style="margin-top:12px">' +
    field(p('sl'), t('sl'), l.stop_loss, 'number', true) +
    field(p('tp'), t('tp'), l.take_profit, 'number', true) + '</div>' +
    '</div>';
}

/* ── DOM → state ─────────────────────────────────────────────────────── */
function syncFromDom() {
  C.layers.forEach((l, i) => {
    const g = (k) => { const e = $('L' + i + '_' + k); return e ? e.value.trim() : undefined; };
    for (const [dom, key] of Object.entries({ entry: 'entry', sl: 'stop_loss', tp: 'take_profit' })) {
      const v = g(dom); if (v !== undefined) l[key] = v;
    }
  });
  const gv = (id) => { const e = $(id); return e ? e.value.trim() : undefined; };
  for (const [id, k] of Object.entries({ acc_start: 'starting_balance', acc_now: 'current_balance', acc_fpl: 'floating_pl' })) {
    const v = gv(id); if (v !== undefined) C.account[k] = v;
  }
  for (const [id, k] of Object.entries({ ctx_thesis: 'thesis', ctx_concern: 'concern' })) {
    const v = gv(id); if (v !== undefined) C.context[k] = v;
  }
}

function wire() {
  view.querySelectorAll('[data-asset]').forEach(b => b.addEventListener('click', () => { syncFromDom(); C.instrument = b.dataset.asset; render(); }));
  view.querySelectorAll('[data-multi]').forEach(b => b.addEventListener('click', () => {
    syncFromDom();
    C.multi = b.dataset.multi === '1';
    if (!C.multi) C.layers = [C.layers[0] || blankLayer()];
    render();
  }));
  view.querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => {
    syncFromDom(); C.layers[+b.dataset.seg].direction = b.dataset.d; render();
  }));
  view.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    syncFromDom(); C.layers.splice(+b.dataset.del, 1);
    if (!C.layers.length) C.layers = [blankLayer()];
    render();
  }));
  const add = $('addLayer');
  if (add) add.addEventListener('click', () => { syncFromDom(); C.layers.push(blankLayer()); render(); });
  view.querySelectorAll('[data-mic]').forEach(b => b.addEventListener('click', () => startDictation(b, b.dataset.mic)));
  view.querySelectorAll('textarea').forEach(el => { autoGrow(el); el.addEventListener('input', () => autoGrow(el)); });
  const go = $('go'); if (go) go.addEventListener('click', submit);
}

/* Validation happens once, at submit — the trader is never blocked mid-page. */
function submit() {
  syncFromDom();
  const err = $('err');
  err.textContent = '';
  if (!C.instrument) { err.textContent = t('needInstrument'); return; }
  if (C.multi === null) C.multi = C.layers.length > 1;
  if (!C.layers.some(l => l.direction && String(l.entry).trim() !== '')) { err.textContent = t('needLayer'); return; }
  runAssessment();
}

/* ── run ─────────────────────────────────────────────────────────────── */
async function runAssessment() {
  if (busy) return;
  syncFromDom();
  busy = true;
  const go = $('go'); if (go) go.disabled = true;
  const b = $('busy'); if (b) b.classList.add('on');
  const bt = $('busyText');
  const t1 = setTimeout(() => { if (bt) bt.textContent = t('analysing2'); }, 2500);
  const t2 = setTimeout(() => { if (bt) bt.textContent = t('analysing3'); }, 9000);

  const num = (v) => (String(v).trim() === '' ? null : Number(v));
  const usableLayers = C.layers.filter(l => l.direction && String(l.entry).trim() !== '');
  const payload = {
    action: 'assess', lang: lang(), identityToken: identityToken(),
    case: {
      instrument: C.instrument,
      layers: usableLayers.map(l => ({
        direction: l.direction, entry: num(l.entry),
        stop_loss: num(l.stop_loss), take_profit: num(l.take_profit),
      })),
      account: {
        starting_balance: num(C.account.starting_balance),
        current_balance: num(C.account.current_balance),
        floating_pl: num(C.account.floating_pl),
      },
      context: {
        thesis: C.context.thesis || null, concern: C.context.concern || null,
        // No standalone direction state exists any more — the layer array is
        // the one source of truth. Layer 1's side IS the position direction
        // for a single-layer assessment (the common case this field once
        // asked about redundantly); for multi-layer it is simply the first
        // layer's side, same as the server already derives net direction
        // from the full `layers` array regardless of this field's value.
        primary_direction: usableLayers[0] ? usableLayers[0].direction : null,
      },
    },
  };

  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const d = await r.json();
    clearTimeout(t1); clearTimeout(t2);
    if (d.freeLimit) freeLimit = d.freeLimit;
    if (d.tier) applyTier(d.tier);
    if (d.mode === 'limit') { result = { gate: d.gate }; render(); return; }
    if (d.mode !== 'assessment') { showErr(); return; }
    result = d; saveHistory(d); render(); renderHistory();
  } catch {
    clearTimeout(t1); clearTimeout(t2); showErr();
  } finally {
    busy = false;
    const g2 = $('go'); if (g2) g2.disabled = false;
    const b2 = $('busy'); if (b2) b2.classList.remove('on');
  }
}
function showErr() { const e = $('err'); if (e) e.textContent = t('failed'); }

/* ── results ─────────────────────────────────────────────────────────── */
function renderResult() {
  if (result.gate) {
    const g = result.gate;
    view.innerHTML = '<div class="gate"><h4>' + esc(g.title || '') + '</h4><p>' + esc(g.headline || '') + '</p>' +
      '<ul>' + (g.steps || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' +
      '<div class="gb"><button class="primary" id="gVerify" type="button">' + esc((g.verifyCta && g.verifyCta.label) || 'Verify now') + '</button>' +
      (g.cta ? '<a class="ghost" href="' + esc(g.cta.url) + '">' + esc(g.cta.label) + '</a>' : '') + '</div>' +
      (g.freeNotice ? '<div class="hint" style="margin-top:10px">' + esc(g.freeNotice) + '</div>' : '') + '</div>';
    const gv = $('gVerify'); if (gv) gv.addEventListener('click', openVerify);
    return;
  }

  const d = result, p = d.position, ev = d.evidence;
  // `ui` (headings/labels, in the exact language this assessment was fetched
  // in) travels with the result from the server — see rescue-assess.js. Older
  // cached history entries saved before this UI existed won't have it, so
  // every lookup below falls back to this page's own client-side string.
  const UI = d.ui || {}, H = UI.headings || {}, Lb = UI.labels || {};
  const uiT = (k) => H[k] || Lb[k] || t(k);
  const money = (v) => (v == null ? null : (v > 0 ? '+' : '') + v.toLocaleString());
  const stat = (labelKey, val, sub, cls) =>
    '<div class="stat' + (cls || '') + '"><i>' + esc(t(labelKey)) + '</i><b>' + esc(val) + '</b>' +
    (sub ? '<u>' + esc(sub) + '</u>' : '') + '</div>';

  let h = '<div class="rHead"><div class="rTop"><h2>' + esc(d.instrument) + '</h2>' +
    '<span class="tag">' + esc(p.netDirection === 'flat' ? 'DELTA-FLAT' : String(p.netDirection || '').toUpperCase()) + '</span>' +
    (p.hedged ? '<span class="tag">HEDGED ' + Math.round(p.hedgeRatio * 100) + '%</span>' : '') +
    '<span class="tag">' + p.layerCount + ' ' + esc(t('layer')) + (p.layerCount > 1 ? 's' : '') + '</span></div><div class="stats">';
  h += stat('current', ev.priceStatus === 'verified' ? String(ev.price) : t('unavailable'),
    ev.priceAt ? new Date(ev.priceAt).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : '');
  const unitLabel = p.sized ? 'lots' : t('units');
  h += stat('netExposure', Math.abs(p.netSize) + ' ' + unitLabel, p.hedged ? p.grossLongSize + ' long / ' + p.grossShortSize + ' short' : '');
  // Break-even stays fully computed (p.breakevenPrice) and travels to the
  // results endpoint's `levels` field for anything that wants it — it is just
  // no longer one of the headline cards. It is a computation aid, not
  // something a trader asked to see as a primary figure.
  h += stat('floating', p.floatingPoints != null ? p.floatingPoints + ' ' + (p.sized ? 'lot-pts' : t('pts')) : t('unavailable'),
    p.floatingMoney != null ? money(p.floatingMoney) : 'DERIVED',
    p.floatingPoints > 0 ? ' pos' : p.floatingPoints < 0 ? ' neg' : '');
  h += '</div></div>';

  // ── FIVE EVIDENCE SECTIONS — Technical / Fundamental / Sentiment /
  // Upcoming Economic Data / General News. Each section header carries the
  // meter's own lean + coverage (meters.js — unmodified) where a meter
  // exists; the body is the SAME localized FACT → IMPACT ON INSTRUMENT →
  // WHY → TRADE EFFECT rows the evidence-impact layer already computes
  // server-side, so nothing here is a new judgement and nothing is stated
  // in a separate card any more (§3). `d.evidenceImpact` is absent on
  // history saved before this existed; that case falls through to the old
  // long-form `d.report` rendering near the bottom of this function so an
  // old entry still shows something coherent rather than an empty page.
  const EI = d.evidenceImpact;
  if (EI) {
    const instName = EI.instrumentName || d.instrument;
    const impactOnLabel = esc(uiT('impactOn').replace('{instrument}', instName));
    const impactRow = (b) => {
      if (b.impact) {
        return '<div class="impactRow"><div class="impactFact">' + esc(b.text) + '</div>' +
          '<div class="impactMeta"><span class="impactBadge ' + esc(b.impact) + '">' +
          impactOnLabel + ': ' + esc(b.impactLabel) + '</span>' +
          '<span class="impactTag">' + esc(b.tag) + '</span></div>' +
          (b.reason ? '<div class="impactReason"><b>' + esc(uiT('why')) + ':</b> ' + esc(b.reason) + '</div>' : '') +
          '</div>';
      }
      return '<div class="impactPlain">' + esc(b.text) + ' — <span class="impactTag">' + esc(b.tag) + '</span></div>';
    };
    const secHead = (headKey, m) => {
      let s = '<div class="secHead"><h4>' + esc(uiT(headKey)) + '</h4>';
      if (m && m.lean != null) {
        s += '<span class="secLean ' + esc(m.lean) + '">' + esc(m.lean) + '</span>' +
          '<span class="secCov">' + esc(t('strength')) + ': ' + esc(m.strength) + ' · ' + esc(t('coverage')) + ' ' + Math.round(m.coverage * 100) + '%</span>';
      }
      s += '</div>';
      return s;
    };
    const sectionCard = (headKey, sec, m) => {
      if (!sec || (!sec.evidence.length && !sec.uncertainty.length)) return '';
      let c = '<div class="impactCard">' + secHead(headKey, m);
      c += sec.evidence.map(impactRow).join('');
      c += sec.uncertainty.map(u => '<div class="impactUnavail">' + esc(uiT('unavailable')) + ' — ' + esc(u) + '</div>').join('');
      c += '</div>';
      return c;
    };

    // D. UPCOMING ECONOMIC DATA — per-event rows, distinct shape from the
    // FACT/IMPACT rows above (no consensus figure exists to score against,
    // so no impact badge is shown here — see calendarSection() server-side).
    const UD = EI.upcomingData;
    let upcomingCard = '';
    if (UD) {
      upcomingCard = '<div class="impactCard">' + secHead('upcomingData', null);
      if (UD.backupNote) upcomingCard += '<div class="impactUnavail">' + esc(UD.backupNote) + '</div>';
      if (UD.events && UD.events.length) {
        const scenarioRow = (s) => '<div class="impactMeta"><span class="impactBadge ' + esc(s.impact === 'conditional' ? 'neutral' : s.impact) + '">' +
          esc(s.label) + ': ' + esc(s.impactLabel) + '</span><span class="impactTag">' + esc(s.tradeEffect) + '</span></div>' +
          '<div class="impactReason">' + esc(s.reason) + '</div>';
        upcomingCard += UD.events.map(e => {
          let row = '<div class="eventRow"><div class="eventWhat">' + esc(e.what) + '</div>' +
            '<div class="eventWhen">' + esc(e.when) + (e.impact ? ' · ' + esc(e.impact) : '') +
            (e.source === 'fred' ? ' · FRED' : '') + '</div>';
          if (e.forecast != null || e.previous != null) {
            row += '<div class="eventWhen">' +
              (e.forecast != null ? 'Forecast: ' + esc(e.forecast) : '') +
              (e.forecast != null && e.previous != null ? ' · ' : '') +
              (e.previous != null ? 'Previous: ' + esc(e.previous) : '') + '</div>';
          }
          row += '<div class="eventLine"><b>' + esc(uiT('whatItMeans')) + ':</b> ' + esc(e.whatItMeans) + '</div>';
          if (e.scenario1 && e.scenario2) {
            row += scenarioRow(e.scenario1) + scenarioRow(e.scenario2);
          }
          row += '<div class="eventLine"><b>' + esc(uiT('tradeRelevance')) + ':</b> ' + esc(e.tradeRelevance) + '</div></div>';
          return row;
        }).join('');
      } else {
        upcomingCard += '<div class="impactUnavail">' + esc(UD.unavailableText || '') + '</div>';
      }
      upcomingCard += '</div>';
    }

    // E. GENERAL NEWS — every headline is Neutral/Uncertain by design (a
    // headline is never converted into a directional call — see newsItems()).
    let newsCard = '';
    if ((EI.news || []).length) {
      newsCard = '<div class="impactCard">' + secHead('news', null) +
        EI.news.map(n => '<div class="impactRow"><div class="impactFact">"' + esc(n.what) + '" — ' + esc(n.source) + '</div>' +
          '<div class="impactMeta"><span class="impactBadge ' + esc(n.impact || 'neutral') + '">' + esc(n.impactLabel) + '</span></div>' +
          '<div class="impactReason"><b>' + esc(uiT('why')) + ':</b> ' + esc(n.why) + ' ' + esc(n.effect) + '</div></div>').join('') +
        '</div>';
    }

    const cards = sectionCard('technical', EI.technical, d.meters.technical) +
      sectionCard('fundamental', EI.fundamental, d.meters.fundamental) +
      sectionCard('sentiment', EI.sentiment, d.meters.sentiment) +
      upcomingCard + newsCard;
    if (cards) h += '<div class="impactWrap">' + cards + '</div>';

    // ── FIVE-FACTOR EVIDENCE SNAPSHOT (§9) — one row per category, then the
    // existing Overall Evidence line (meters.js's own lean, summed — unchanged).
    if (d.fiveFactor && d.fiveFactor.length) {
      h += '<div class="snapshotCard">';
      for (const row of d.fiveFactor) {
        h += '<div class="snapshotRow"><span class="snapshotLabel">' + esc(row.label) + '</span>' +
          '<span class="snapshotWord ' + esc(row.lean || 'neutral') + '">' + esc(row.word) + '</span></div>';
      }
      if (d.overallEvidence) h += '<div class="snapshotOverall">' + esc(uiT('overallEvidence')) + ': ' + esc(d.overallEvidence.text) + '</div>';
      h += '</div>';
    }
  }

  // ── FINAL MENTOR REVIEW — the most prominent card on the page (§23).
  // `d.finalMentorReview` is the structured version (whereNow/strongestSupport
  // /strongestRisk/takeaway/disclaimer); `d.report` is the short flowing-prose
  // version of the same facts (the LLM's paraphrase, or a deterministic
  // fallback built from those same fields — never a disagreement). History
  // saved before this redesign has neither structured field, only the old
  // long `report` text — that still renders here via the markdown helper,
  // so an old entry degrades gracefully instead of showing nothing.
  const FMR = d.finalMentorReview;
  h += '<div class="mentorCard"><h3>' + esc(uiT('finalView')) + '</h3>';
  if (FMR) {
    if (d.report) h += '<p class="mentorProse">' + esc(d.report) + '</p>';
    h += '<div class="mentorRow"><b>' + esc(uiT('strongestSupport')) + ':</b> ' + esc(FMR.strongestSupport) + '</div>';
    h += '<div class="mentorRow"><b>' + esc(uiT('strongestRisk')) + ':</b> ' + esc(FMR.strongestRisk) + '</div>';
    h += '<div class="mentorDisclaimer">' + esc(FMR.disclaimer) + '</div>';
  } else {
    h += md(d.report || '');
  }
  h += '</div>';

  // ── TRADE MANAGEMENT SOLUTIONS — three named, genuinely different
  // strategies, each with a transparent Management Fit rating (§12–§14).
  // `o.rating` is absent on history saved before this redesign; the badge is
  // simply omitted then; What/Why/Trigger/Risk still render as before. ──
  const opts = d.managementOptions || [];
  if (opts.length) {
    h += '<div class="optsWrap">';
    opts.forEach((o, i) => {
      h += '<div class="optCard' + (o.refused ? ' refused' : '') + '">' +
        '<div class="optNum">' + esc(uiT('option')) + ' ' + (i + 1) + '</div>' +
        '<div class="optTitle">' + esc(o.title) +
        (o.rating != null ? ' <span class="fitBadge" title="' + esc(uiT('managementFitNote')) + '">' + esc(uiT('managementFit')) + ' ' + esc(o.rating) + '/10</span>' : '') +
        '</div>' +
        '<div class="optSub">' + esc(uiT('readReason')) + '</div>' +
        '<div class="optField"><b>' + esc(uiT('what')) + '</b><p>' + esc(o.what) + '</p></div>' +
        '<div class="optField"><b>' + esc(uiT('why')) + '</b><p>' + esc(o.why) + '</p></div>' +
        (o.trigger ? '<div class="optField"><b>' + esc(uiT('trigger')) + '</b><p>' + esc(o.trigger) + '</p></div>' : '') +
        '<div class="optField"><b>' + esc(uiT('risk')) + '</b><p>' + esc(o.risk) + '</p></div>' +
        '</div>';
    });
    h += '</div>';
  }

  // ── SOURCES / PROVENANCE — kept as its own standalone card (§26). ──
  h += '<div class="overviewSep">' + esc(t('sources')) + '</div>';
  const P = d.providers || {};
  const provRow = (key, label) => {
    const p = P[key]; if (!p) return '';
    const ok = p.status === 'verified';
    return '<div>· <b>' + esc(label) + '</b> — ' +
      (ok ? esc(p.provider || '') + (p.viaFallback ? ' <em>(' + esc(t('backup')) + ')</em>' : '') +
            (p.at ? ', ' + esc(String(p.at).replace('T', ' ').slice(0, 16)) + ' UTC' : '')
          : esc(p.note || t('unavailable'))) + '</div>';
  };
  h += '<div class="report"><div class="prov standalone">' +
    provRow('price', t('current')) + provRow('macro', t('provMacro')) + provRow('news', t('provNews')) +
    provRow('calendar', t('provEvents')) + provRow('history', t('provHistory')) +
    (ev.provenance || []).map(x => '<div>· ' + esc(x) + '</div>').join('') +
    '<div>· ' + esc(d.history.status === 'verified'
      ? t('histLabel') + ' — ' + d.history.source + ', ' + d.history.count + ' ' + t('histDaily')
      : (d.history.note || t('histUnavailable'))) + '</div>' +
    (ev.unavailable || []).map(x => '<div>· ' + esc(x) + '</div>').join('') +
    '<div>· Meters: ' + esc(d.meters.methodology.formula) + '</div>' +
    '<div>· ' + esc(d.meters.methodology.strength) + '</div>' +
    '</div></div>';

  h += '<div class="nav"><span class="navSp"></span><button class="btn primary" id="again" type="button">' + esc(t('again')) + '</button></div>';
  view.innerHTML = h;
  const ag = $('again'); if (ag) ag.addEventListener('click', startNew);
}

/* Minimal markdown → HTML. Headings, bullets, tables, bold/italic only. */
function md(src) {
  const lines = String(src || '').split('\n');
  let out = '', inUl = false, inTable = false;
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_(.+?)_($|[\s.,)])/g, '$1<em>$2</em>$3')
    .replace(/`(.+?)`/g, '<code>$1</code>');
  const closeUl = () => { if (inUl) { out += '</ul>'; inUl = false; } };
  const closeTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { closeUl(); closeTable(); continue; }
    if (/^\|/.test(l)) {
      const cells = l.split('|').slice(1, -1).map(c => c.trim());
      if (/^[-\s|:]+$/.test(l)) continue;
      if (!inTable) { out += '<table><thead><tr>' + cells.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'; inTable = true; }
      else out += '<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      continue;
    }
    closeTable();
    if (/^###\s+/.test(l)) { closeUl(); out += '<h3>' + inline(l.replace(/^###\s+/, '')) + '</h3>'; continue; }
    if (/^[-•]\s+/.test(l)) { if (!inUl) { out += '<ul>'; inUl = true; } out += '<li>' + inline(l.replace(/^[-•]\s+/, '')) + '</li>'; continue; }
    closeUl();
    out += '<p>' + inline(l) + '</p>';
  }
  closeUl(); closeTable();
  return out;
}

/* ── history — Rescue's own key, never the retired assistant's ────────── */
function readHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; } }
function writeHistory(list) { try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 25))); } catch {} }
function saveHistory(d) {
  const list = readHistory();
  list.unshift({
    id: 'c' + Date.now(), at: new Date().toISOString(),
    instrument: d.instrument, direction: d.position.netDirection,
    layers: d.position.layerCount, report: d.report,
    payload: {
      position: d.position, meters: d.meters, evidence: d.evidence, history: d.history,
      instrument: d.instrument, report: d.report,
      managementOptions: d.managementOptions, marketDirection: d.marketDirection,
      overallEvidence: d.overallEvidence, ui: d.ui,
      evidenceImpact: d.evidenceImpact, finalMentorReview: d.finalMentorReview, fiveFactor: d.fiveFactor,
      providers: d.providers,
    },
  });
  writeHistory(list);
}
/* Removes one assessment from this browser's local Rescue history only — the
   assessment itself was never persisted server-side, so there is nothing
   else to delete. A native confirm() keeps this reliable and fully
   keyboard/screen-reader accessible without adding a second UI pattern. */
function deleteHistoryItem(id) {
  if (!window.confirm(t('histDeleteConfirm'))) return;
  writeHistory(readHistory().filter(c => c.id !== id));
  renderHistory();
}
function renderHistory() {
  const list = readHistory();
  histList.innerHTML = '';
  for (const c of list) {
    const item = document.createElement('div');
    item.className = 'histItem';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'histSelect';
    b.innerHTML = '<b>' + esc(c.instrument + ' · ' + String(c.direction || '').toUpperCase()) + '</b>' +
      '<span>' + esc(new Date(c.at).toISOString().slice(0, 10)) + ' · ' + c.layers + ' layer' + (c.layers > 1 ? 's' : '') + '</span>';
    b.addEventListener('click', () => { result = c.payload; render(); closeSide(); });
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'histDel';
    del.setAttribute('aria-label', t('histDeleteAria'));
    del.title = t('histDelete');
    del.innerHTML = '×';
    del.addEventListener('click', (e) => { e.stopPropagation(); deleteHistoryItem(c.id); });
    item.appendChild(b);
    item.appendChild(del);
    histList.appendChild(item);
  }
}
function startNew() { result = null; C = newCase(); render(); closeSide(); }

/* ── shell ───────────────────────────────────────────────────────────── */
$('backBtn').addEventListener('click', () => {
  let hasMeaningfulHistory = false;
  try {
    hasMeaningfulHistory = window.history.length > 1 && !!document.referrer &&
      new URL(document.referrer).origin === window.location.origin;
  } catch { hasMeaningfulHistory = false; }
  if (hasMeaningfulHistory) window.history.back();
  else window.location.href = 'index.html';
});
function openSide() { side.classList.add('open'); scrim.classList.add('open'); burger.setAttribute('aria-expanded', 'true'); }
function closeSide() { side.classList.remove('open'); scrim.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); }
burger.addEventListener('click', () => (side.classList.contains('open') ? closeSide() : openSide()));
scrim.addEventListener('click', closeSide);
$('newBtn').addEventListener('click', startNew);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSide(); });

langSel.addEventListener('change', () => {
  try { localStorage.setItem(LANG_KEY, langSel.value); } catch {}
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { const s = t(n.dataset.i18nAria); n.setAttribute('aria-label', s); n.setAttribute('title', s); });
  syncFromDom(); render();
});

/* ── boot ────────────────────────────────────────────────────────────── */
try { const l = localStorage.getItem(LANG_KEY); if (l && I18N[l]) langSel.value = l; } catch {}
document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
document.querySelectorAll('[data-i18n-aria]').forEach(n => { const s = t(n.dataset.i18nAria); n.setAttribute('aria-label', s); n.setAttribute('title', s); });
paintAccess();
refreshAccess();
renderHistory();
render();
</script>
