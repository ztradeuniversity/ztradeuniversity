<!-- ════════════════════════════════════════════════════════════════════════
     RETIRED — ZTU general AI Trading Assistant.

     The general assistant is closed as a user-facing product. ZTU Rescue is now
     the only AI trading-management surface, so this page carries NONE of the old
     product's branding, copy or UI and offers it as no kind of alternative.

     The URL itself is kept alive on purpose: it is indexed, bookmarked and
     linked from older material, and deleting the file would turn every one of
     those into a 404. It forwards to ZTU Rescue instead, preserving the
     ?q=…&send=1 contract so an old deep link still prefills the composer.

     The previous 3,678-line implementation is preserved in git history
     (commit e57b0d0) and can be restored from there if it is ever needed.

     /api/ai-chat is deliberately NOT touched: the admin Content Center calls it
     directly (admin/js/content-center.js) and still genuinely requires it.
     ════════════════════════════════════════════════════════════════════════ -->

<title>ZTU Rescue — Trade Management &amp; Analysis</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://ztradeuniversity.com/trade-rescue.html" />
<meta http-equiv="refresh" content="0; url=trade-rescue.html" />
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#6b6d76;background:#fff}
  a{color:#a9711a}
</style>
</head>
<body>
  <p>Taking you to <a href="trade-rescue.html">ZTU Rescue</a>…</p>
<script>
  /* Forward immediately, carrying any ?q=…&send=1 through so old deep links
     still prefill the composer. replace() keeps this page out of history, so
     Back does not bounce the visitor straight back into the redirect. */
  (function () {
    try {
      var qs = window.location.search || '';
      window.location.replace('trade-rescue.html' + qs);
    } catch (e) {
      window.location.href = 'trade-rescue.html';
    }
  })();
</script>
</body>
</html>
